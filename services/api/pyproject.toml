[project]
name = "trackflow-api"
version = "0.1.0"
description = "API de TrackFlow: directorio de proveedores (FastAPI + Pydantic + TinyDB)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# El código vive en `app/` (sin `src/`), con el entrypoint `app.main:app` de docs/ARCHITECTURE_PROPOSAL.md.
module-name = "app"
module-root = ""

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
