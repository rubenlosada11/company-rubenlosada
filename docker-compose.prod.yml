# Docker Compose de PRODUCCIÓN (VPS). Imágenes de producción, sin código montado, sin --reload ni next dev.
#
# Las imágenes se COMPILAN EN TU EQUIPO (el VPS tiene ~1 GB de RAM) y se copian al VPS; allí solo se ejecutan:
#   equipo:  $env:IMAGE_TAG = git rev-parse --short HEAD
#            docker compose -f docker-compose.prod.yml --env-file env.prod.example build
#   VPS:     docker compose -f docker-compose.prod.yml up -d --no-build      (en /opt/company-rubenlosada, con su .env)
# Pasos completos, actualización y vuelta atrás: docs/docker.md.
#
# Sin acceso público: los puertos solo escuchan en 127.0.0.1 del VPS; se accede con un túnel SSH.
name: trackflow-prod

services:
  backend:
    build:
      context: ./services
      dockerfile: Dockerfile
      target: prod
      additional_contexts:
        packages: ./packages/analisis-incidencias
    image: trackflow-backend:${IMAGE_TAG:?Define IMAGE_TAG (etiqueta de las imágenes) en .env o en el entorno}
    # Las imágenes llegan con `docker load`: nunca se descargan de un registro.
    pull_policy: never
    restart: unless-stopped
    # Secretos de la API: solo en el .env del VPS.
    env_file: .env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Define FRONTEND_BASE_URL}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      # TinyDB (usuarios, proveedores, incidencias) y SQLite (inventario) persistentes.
      - api-data:/app/services/api/db
    # El código es de solo lectura; solo escribe en el volumen de datos y en /tmp (subida de CSV).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    networks:
      - trackflow-prod-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
      target: prod
      args:
        # Se incrustan en el bundle al compilar: URL de la API tal como la ve el navegador (túnel SSH).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Define NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:-}
    image: trackflow-interfaces:${IMAGE_TAG:?Define IMAGE_TAG (etiqueta de las imágenes) en .env o en el entorno}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBSITE_PORT:-3000}:3000"
      - "127.0.0.1:${BACKOFFICE_PORT:-3001}:3001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trackflow-prod-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ && wget -q -O /dev/null http://127.0.0.1:3001/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging

networks:
  trackflow-prod-net:
    name: trackflow-prod-net

volumes:
  api-data:
    name: trackflow-api-data
